		.ag-widget .ag-actions { margin-top: 8px; text-align: center; }

		.ag-widget .ag-dot.ag-on { background: var(--al-success-color, #4caf50); }
		.ag-widget .ag-lbl-offline, .ag-widget .ag-offline .ag-lbl-online { display: none; }
		.ag-widget .ag-offline .ag-lbl-offline { display: inline; }

		.ag-widget .ag-update.ag-on { display: inline; }

		.ag-widget .ag-refresh.ag-spin i { animation: fa-spin 1s linear infinite; }
		.ag-widget .ag-popup { display: none; position: fixed; z-index: 1050; max-height: 60vh; max-width: 92vw; overflow: auto; padding: 6px 8px; border-radius: 6px; font-size: 12px; text-align: left; color: #333; background: #fff; border: 1px solid rgba(127,127,127,.4); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
		.ag-widget .ag-popup.ag-open { display: block; }
		.ag-widget .ag-popup table { border-collapse: collapse; color: inherit; font-size: inherit; }

		.ag-widget .ag-popup tr + tr td { border-top: 1px solid rgba(127,127,127,.2); }

	</style>
	<center class="widget-name">
		<span class="warning" title="#alert_name#"><i class='#alert_icon#'></i></span>
		<span>#name_display# <span class="object_name">#object_name#</span></span>
	</center>
	#ag_icons#
	<div class="ag-body" data-ag_names="#ag_names#">
		<div class="ag-head">
			<img class="ag-img" src="#ag_image#" alt=""/>
			<div class="ag-protection">#ag_protection#</div>
			#ag_switch#
		</div>
		#ag_tiles#
		#ag_chips#
		#ag_actions#
		<div class="ag-foot">#ag_foot#</div>
		#ag_others#
	</div>
	<script>
		(function() {
			var root = document.querySelector('.eqLogic[data-eqLogic_uid="#uid#"]');
			if (!root) return;
			if (typeof jeedom.cmd.addUpdateFunction !== 'function') { // avant 4.3
				jeedom.cmd.addUpdateFunction = function(id, func) {
					jeedom.cmd.update[id] = func;
				};
			}
			var format = function(value, decimals) {
				if (value === '' || value === null || value === undefined) return '—';
				var number = parseFloat(value);
				if (isNaN(number)) return value;
				return number.toLocaleString(undefined, {maximumFractionDigits: decimals || 0});
			};
			var duration = function(seconds) {
				seconds = Math.max(0, Math.round(seconds));
				var h = Math.floor(seconds / 3600), m = Math.floor(seconds % 3600 / 60), s = seconds % 60;
				return (h > 0 ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (s < 10 ? '0' : '') + s;
			};
			// pourcentages des tuiles, calculés à partir des valeurs affichées dans le widget
			var ratios = function(widget) {
				widget.querySelectorAll('[data-ag_ratio]').forEach(function(el) {
					var part = widget.querySelector('[data-ag_cmd="' + el.getAttribute('data-ag_part') + '"]');
					var total = widget.querySelector('[data-ag_cmd="' + el.getAttribute('data-ag_total') + '"]');
					var p = part ? parseFloat(part.getAttribute('data-ag_value')) : NaN;
					var t = total ? parseFloat(total.getAttribute('data-ag_value')) : NaN;
					var pct = (t > 0 && !isNaN(p)) ? p * 100 / t : 0;
					if (el.getAttribute('data-ag_ratio') == 'bar') el.style.width = Math.max(0, Math.min(100, pct)) + '%';
					else el.textContent = format(pct, pct < 10 ? 1 : 0) + '%';
				});
			};
			// compte à rebours de la pause : AdGuard Home ne renvoie le temps restant qu'à chaque actualisation
			var tick = function(widget) {
				var el = widget.querySelector('[data-ag_kind="pause"]');
				if (!el) return;
				var left = (parseFloat(el.getAttribute('data-ag_until')) - Date.now()) / 1000;
				widget.classList.toggle('ag-paused', left > 0);
				el.textContent = duration(left);
			};
			var apply = function(el, value) {
				var widget = el.closest('.ag-widget');
				var kind = el.getAttribute('data-ag_kind');
				var number = parseFloat(value);
				if (el.getAttribute('data-ag_invert') == '1') number = (number == 1) ? 0 : 1; // client : 1 = internet bloqué
				el.setAttribute('data-ag_value', (value === null || value === undefined) ? '' : value);
				switch (kind) {
					case 'protection':
						el.classList.toggle('ag-off', number != 1);
						break;
					case 'pause':
						el.setAttribute('data-ag_until', Date.now() + (number > 0 ? number * 1000 : 0));
						tick(widget);
						break;
					case 'online':
						el.parentNode.classList.toggle('ag-offline', number != 1);
						el.classList.toggle('ag-on', number == 1);
						break;
					case 'chip':
						if (el.getAttribute('data-ag_scope')) widget.classList.toggle('ag-scope-' + el.getAttribute('data-ag_scope'), number == 1);
						el.classList.toggle('ag-on', number == 1);
						el.setAttribute('title', el.getAttribute(number == 1 ? 'data-ag_tip_on' : 'data-ag_tip_off') || '');
						break;
					case 'result':
						el.textContent = (value === null || value === undefined) ? '' : value;
						break;
					case 'switch':
					case 'flag':
						el.classList.toggle('ag-on', number == 1);
						break;
					case 'services': // icônes, nom complet en infobulle ; le nom s'affiche si l'icône n'est pas connue
						if (!widget.agNames) {
							try { widget.agNames = JSON.parse(widget.querySelector('.ag-body').getAttribute('data-ag_names')) || {}; } catch (e) { widget.agNames = {}; }
						}
						el.textContent = '';
						var list = String((value === null || value === undefined) ? '' : value).split(',').filter(function(id) { return id.trim() !== ''; });
						if (list.length == 0) {
							el.textContent = '—';
							break;
						}
						var box = document.createElement('span');
						box.className = 'ag-svc-list';
						list.forEach(function(id) {
							id = id.trim();
							var name = widget.agNames[id] || id;
							var item = document.createElement('span');
							item.className = 'ag-svc';
							item.title = name;
							var icon = document.createElement('i');
							icon.className = 'ag-svc-ico' + (/^[a-z0-9_]+$/i.test(id) ? ' ag-svc-' + id : '');
							var label = document.createElement('span');
							label.className = 'ag-svc-name';
							label.textContent = name;
							item.appendChild(icon);
							item.appendChild(label);
							box.appendChild(item);
						});
						el.appendChild(box);
						var check = function() {
							box.querySelectorAll('.ag-svc').forEach(function(item) {
								var style = window.getComputedStyle(item.querySelector('.ag-svc-ico'));
								var mask = style.webkitMaskImage || style.maskImage || 'none';
								item.classList.toggle('ag-noicon', mask == 'none');
							});
						};
						check();
						[300, 1500, 5000].forEach(function(delay) { // la feuille des icônes peut finir de charger après le widget
							setTimeout(check, delay);
						});
						break;
					case 'list':
						el.textContent = (value === '' || value === null || value === undefined) ? '—' : String(value).split(',').join(', ');
						break;
					case 'text':
						el.textContent = (value === '' || value === null || value === undefined) ? '—' : value;
						break;
					default:
						el.textContent = format(value, 2);
				}
			};
			root.querySelectorAll('[data-ag_cmd]').forEach(function(el) {
				apply(el, el.getAttribute('data-ag_value'));
			});
			ratios(root);
			var ids = {};
			root.querySelectorAll('[data-ag_cmd]').forEach(function(el) {
				ids[el.getAttribute('data-ag_cmd')] = true;
			});
			Object.keys(ids).forEach(function(id) {
				// Le core ignore une fonction identique déjà enregistrée pour la commande : après un redessin du widget c'est
				// donc l'ancienne qui reste. Elle cherche les éléments dans la page à chaque valeur, jamais ceux d'avant.
				jeedom.cmd.addUpdateFunction(id, function(_options) {
					var value = (_options.value !== undefined) ? _options.value : _options.display_value;
					document.querySelectorAll('.ag-widget [data-ag_cmd="' + id + '"]').forEach(function(el) {
						apply(el, value);
						ratios(el.closest('.ag-widget'));
					});
				});
			});
			var timer = setInterval(function() {
				if (!document.body.contains(root)) { // widget redessiné
					clearInterval(timer);
					return;
				}
				tick(root);
			}, 1000);

			// popups (pause et autres valeurs) : sous le bouton, sans sortir de l'écran, mêmes couleurs que le widget
			var popups = [];
			var open = function(button, popup) {
				popups.forEach(function(other) {
					if (other != popup) other.classList.remove('ag-open');
				});
				if (popup.classList.toggle('ag-open')) {
					var style = window.getComputedStyle(root);
					if (style.backgroundColor && style.backgroundColor != 'transparent' && style.backgroundColor.indexOf('rgba(0, 0, 0, 0)') == -1) {
						popup.style.backgroundColor = style.backgroundColor;
						popup.style.color = style.color;
					}
					var rect = button.getBoundingClientRect();
					popup.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - popup.offsetWidth - 4)) + 'px';
					popup.style.top = Math.max(4, Math.min(rect.bottom + 4, window.innerHeight - popup.offsetHeight - 4)) + 'px';
				}
			};
			var popup = function(button, menu) {
				if (!button || !menu) return;
				popups.push(menu);
				menu.addEventListener('click', function(event) {
					event.stopPropagation();
				});
			};
			var close = function(event) {
				if (!document.body.contains(root)) { // widget redessiné
					document.removeEventListener('click', close);
					window.removeEventListener('scroll', close, true);
					return;
				}
				popups.forEach(function(menu) {
					// le défilement de la liste elle-même, ou du clavier mobile pendant la saisie, ne ferme pas le popup
					if (event && event.type == 'scroll' && (menu.contains(event.target) || menu.contains(document.activeElement))) return;
					menu.classList.remove('ag-open');
				});
			};
			document.addEventListener('click', close);
			window.addEventListener('scroll', close, true);

			var more = root.querySelector('.ag-more');
			var others = root.querySelector('.ag-others');
			popup(more, others);
			if (more && others) {
				more.addEventListener('click', function(event) {
					event.stopPropagation();
					open(more, others);
				});
			}
			// protection : activée -> menu des durées de pause, désactivée -> réactivation
			var button = root.querySelector('.ag-switch');
			var pauseMenu = root.querySelector('.ag-pause-menu');
			popup(button, pauseMenu);
			if (button) {
				button.addEventListener('click', function(event) {
					event.stopPropagation();
					if (!button.classList.contains('ag-on')) {
						jeedom.cmd.execute({id: button.getAttribute('data-ag_on')});
					} else if (pauseMenu) {
						open(button, pauseMenu);
					} else {
						jeedom.cmd.execute({id: button.getAttribute('data-ag_off')});
					}
				});
			}
			if (pauseMenu) {
				pauseMenu.querySelectorAll('[data-ag_select]').forEach(function(item) {
					item.addEventListener('click', function() {
						pauseMenu.classList.remove('ag-open');
						jeedom.cmd.execute({id: button.getAttribute('data-ag_off'), value: {select: item.getAttribute('data-ag_select')}});
					});
				});
			}
			root.querySelectorAll('.ag-chip').forEach(function(chip) {
				chip.addEventListener('click', function() {
					jeedom.cmd.execute({id: chip.classList.contains('ag-on') ? chip.getAttribute('data-ag_off') : chip.getAttribute('data-ag_on')});
				});
			});
			// outils : liste ou saisie de la ligne envoyée avec la commande, puis un retour vert ou rouge sur le bouton
			var flash = function(btn, cls) {
				btn.classList.remove('ag-busy');
				btn.classList.add(cls);
				setTimeout(function() {
					btn.classList.remove(cls);
				}, 1200);
			};
			// confirmation avec la boîte de dialogue de Jeedom (jeeDialog en 4.4, sinon bootbox, sinon celle du navigateur)
			var ask = function(question, run) {
				if (!question) return run();
				if (typeof jeeDialog !== 'undefined' && jeeDialog.confirm) {
					jeeDialog.confirm(question, function(result) { if (result) run(); });
				} else if (typeof bootbox !== 'undefined') {
					bootbox.confirm(question, function(result) { if (result) run(); });
				} else if (window.confirm(question)) {
					run();
				}
			};
			root.querySelectorAll('.ag-btn[data-ag_exec]').forEach(function(btn) {
				btn.addEventListener('click', function() {
					var kind = btn.getAttribute('data-ag_input');
					var field = btn.closest('.ag-tool').querySelector('.ag-field');
					// un groupe choisi dans la liste des services passe par la commande du groupe
					var group = field && field.getAttribute('data-ag_group') == '1' && btn.getAttribute('data-ag_exec_group');
					var options = {id: group ? btn.getAttribute('data-ag_exec_group') : btn.getAttribute('data-ag_exec')};
					if (kind) {
						var value = field ? field.value.trim() : '';
						if (value === '') {
							flash(btn, 'ag-ko');
							if (field) field.focus();
							return;
						}
						options.value = (kind == 'select') ? {select: value} : {title: '', message: value};
					}
					options.success = function() {
						flash(btn, 'ag-ok');
						if (kind == 'message' && field) field.value = '';
					};
					options.error = function(error) {
						flash(btn, 'ag-ko');
						if (error && error.message && typeof jeedomUtils !== 'undefined' && jeedomUtils.showAlert) jeedomUtils.showAlert({message: error.message, level: 'danger'});
					};
					ask(btn.getAttribute('data-ag_confirm'), function() {
						btn.classList.add('ag-busy');
						jeedom.cmd.execute(options);
					});
				});
			});
			root.querySelectorAll('.ag-tool input.ag-field').forEach(function(field) {
				field.addEventListener('keydown', function(event) { // Entrée = premier bouton de la ligne
					if (event.key != 'Enter') return;
					event.preventDefault();
					var btn = field.closest('.ag-tool').querySelector('.ag-btn');
					if (btn) btn.click();
				});
			});
			// liste des services avec icônes : recherche, puis le choix remplit le champ caché de la ligne
			root.querySelectorAll('.ag-pick').forEach(function(pick) {
				var tool = pick.closest('.ag-tool');
				var menu = tool.querySelector('.ag-pick-menu');
				var field = tool.querySelector('.ag-field');
				var search = menu.querySelector('.ag-pick-search');
				popup(pick, menu);
				pick.addEventListener('click', function(event) {
					event.stopPropagation();
					open(pick, menu);
					if (menu.classList.contains('ag-open') && !('ontouchstart' in window)) search.focus();
				});
				search.addEventListener('input', function() {
					var text = search.value.trim().toLowerCase();
					var match = function(item) {
						return text === '' || (item.querySelector('span') || item).textContent.toLowerCase().indexOf(text) != -1 || item.getAttribute('data-ag_value').indexOf(text) != -1;
					};
					// un groupe qui correspond montre tous ses services, un service qui correspond montre son groupe
					var groupItem = null, groupMatch = false, groupShown = false;
					var finish = function() {
						if (groupItem) groupItem.classList.toggle('ag-hidden', !(groupMatch || groupShown));
					};
					menu.querySelectorAll('.ag-pick-item, .ag-pick-header').forEach(function(item) {
						if (item.classList.contains('ag-pick-header')) {
							finish();
							groupItem = null;
							return;
						}
						if (item.getAttribute('data-ag_group') == '1') {
							finish();
							groupItem = item;
							groupMatch = match(item);
							groupShown = false;
							return;
						}
						var show = (groupItem && groupMatch) || match(item);
						item.classList.toggle('ag-hidden', !show);
						if (show) groupShown = true;
					});
					finish();
				});
				menu.querySelectorAll('.ag-pick-item').forEach(function(item) {
					item.addEventListener('click', function() {
						field.value = item.getAttribute('data-ag_value');
						field.setAttribute('data-ag_group', item.getAttribute('data-ag_group') || '0');
						pick.querySelector('.ag-pick-label').textContent = (item.querySelector('span') || item).textContent;
						var icon = item.querySelector('i');
						pick.querySelector('i').className = icon.className + (icon.classList.contains('fas') ? ' ag-pick-icon' : '');
						menu.classList.remove('ag-open');
					});
				});
			});
			var update = root.querySelector('.ag-update[data-ag_update]');
			if (update) {
				update.addEventListener('click', function() {
					var run = function() {
						jeedom.cmd.execute({id: update.getAttribute('data-ag_update')});
					};
					ask(update.getAttribute('data-ag_confirm'), run);
				});
			}
			var refresh = root.querySelector('.ag-refresh');
			if (refresh) {
				refresh.addEventListener('click', function() {
					refresh.classList.add('ag-spin');
					jeedom.cmd.execute({id: refresh.getAttribute('data-ag_exec'), success: function() {
						refresh.classList.remove('ag-spin');
					}, error: function() {
						refresh.classList.remove('ag-spin');
					}});
				});
			}
		})();
	</script>
</div>
